[project]
name = "public-data-pipeline"
version = "0.1.0"
description = "Scheduled collection of public data into clean, de-duplicated spreadsheets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
apify = ["apify>=2.0"]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
